# Dependabot version updates. The upstream file shipped with an empty
# package-ecosystem, which Dependabot rejects, so no update ever ran and the
# lockfile drifted 3+ months behind published fixes (mcp CVE-2026-52869,
# python-multipart CVE-2026-53539). "uv" updates uv.lock and any matching
# pins in pyproject.toml; the other two cover the CI actions and the base
# image in the Dockerfile.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
