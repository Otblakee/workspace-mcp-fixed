<div dir="ltr"><table cellpadding="0" cellspacing="0" border="0" style="color:rgb(51,51,51);border-collapse:collapse;max-width:520px;font-family:Arial,Helvetica,sans-serif"><tbody>
<tr><td style="padding:0px 0px 10px"><img src="{{logo_url}}" width="{{logo_w}}"{{#if logo_h}} height="{{logo_h}}"{{/if}} alt="{{entity_name}}" style="display:block"></td></tr>
<tr><td style="border-top:2px solid {{rule_rgb}};padding:10px 0px 0px;font-size:12px;line-height:1.6">
<span style="font-size:14px;color:{{name_rgb}};font-weight:700">{{name}}</span> <span style="color:rgb(153,153,153)"> | </span> <span style="color:rgb(85,85,85)">{{title}}, {{entity_name}}</span><br>
<span style="color:{{label_rgb}};font-weight:700">T</span> {{office_tel}}{{#if ddi}} <span style="color:rgb(153,153,153)">  ·  </span> <span style="color:{{label_rgb}};font-weight:700">DDI</span> {{ddi}}{{/if}}{{#if mobile}} <span style="color:rgb(153,153,153)">  ·  </span> <span style="color:{{label_rgb}};font-weight:700">M</span> {{mobile}}{{/if}}<br>
<span style="color:{{label_rgb}};font-weight:700">E</span> <a href="mailto:{{email}}" style="color:rgb(85,85,85);text-decoration:none">{{email}}</a> <span style="color:rgb(153,153,153)">  ·  </span> <span style="color:{{label_rgb}};font-weight:700">W</span> <a href="https://{{website}}/" style="color:rgb(85,85,85);text-decoration:none">{{website}}</a><br>
<span style="color:rgb(119,119,119);font-size:11px">{{address}}</span></td></tr>
<tr><td style="padding-top:10px;font-size:9px;color:rgb(153,153,153);line-height:1.5">Registered in England &amp; Wales No. {{company_no}} | VAT {{vat_no}} | Registered office as above.</td></tr>
</tbody></table></div>
