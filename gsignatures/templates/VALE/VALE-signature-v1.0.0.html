<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:18px;color:#222222;">
  <tr><td style="padding:0 0 2px 0;font-weight:bold;">{{name}}</td></tr>
  <tr><td style="padding:0 0 2px 0;">{{title}}</td></tr>
  {{#mobile}}<tr><td style="padding:0 0 2px 0;">Mobile: {{mobile}}</td></tr>{{/mobile}}
  <tr><td style="padding:0 0 10px 0;">{{email}}</td></tr>
  <tr><td style="padding:0;font-size:10px;line-height:14px;color:#777777;">{{statutory}}</td></tr>
</table>
