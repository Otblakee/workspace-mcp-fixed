# Render service definition for OTB Workspace MCP (Otblakee/otb-workspace-mcp).
#
# Single-worker async server (the FastMCP streamable-HTTP transport is
# session-stateful; multi-worker requires shared session storage and
# sticky routing — see the Task 3 audit for details).
#
# A persistent Render Disk is mounted at /data so OAuth tokens, FastMCP
# OAuth-proxy state, and Gmail/Chat attachments survive redeploys. The
# in-container default credentials path (~/.google_workspace_mcp/credentials)
# is overridden via WORKSPACE_MCP_CREDENTIALS_DIR.
#
# After applying this file, the following env vars MUST still be set in
# the Render dashboard (they're secrets, not stored in the repo):
#   - GOOGLE_OAUTH_CLIENT_ID
#   - GOOGLE_OAUTH_CLIENT_SECRET
#   - GOOGLE_OAUTH_REDIRECT_URI
#   - AUDIT_SHEET_ID
#   - FASTMCP_SERVER_AUTH_GOOGLE_JWT_SIGNING_KEY (recommended; otherwise
#     derived from the client secret on every restart)
#
# Do NOT set WORKSPACE_MCP_STATELESS_MODE=true here — it disables the
# disk-backed credential store at auth/google_auth.py:623,692,745 and
# defeats the whole point of the disk.

services:
  - type: web
    name: workspace-mcp
    runtime: docker
    plan: standard
    region: frankfurt  # set to whichever Render region you're using
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    disk:
      name: workspace-mcp-data
      mountPath: /data
      sizeGB: 1  # tokens are tiny; bump if attachment storage grows
    envVars:
      # ---- credential / OAuth state persistence on the mounted disk ----
      - key: WORKSPACE_MCP_CREDENTIALS_DIR
        value: /data/credentials
      - key: WORKSPACE_MCP_OAUTH_PROXY_STORAGE_BACKEND
        value: disk
      - key: WORKSPACE_MCP_OAUTH_PROXY_DISK_DIRECTORY
        value: /data/oauth-proxy
      - key: WORKSPACE_ATTACHMENT_DIR
        value: /data/attachments
      # FastMCP's own fallback OAuth-proxy store (used only if the DiskStore
      # backend above fails to load) lives under FASTMCP_HOME/oauth-proxy.
      # Pin it to the disk too so no code path can leave OAuth state on the
      # ephemeral container filesystem.
      - key: FASTMCP_HOME
        value: /data/fastmcp

      # ---- public URL ----
      # OAuth issuer / callback and attachment URLs are built from this.
      # Render injects RENDER_EXTERNAL_URL automatically and the code falls
      # back to it, but set it explicitly if a custom domain fronts the
      # service.
      - key: WORKSPACE_EXTERNAL_URL
        sync: false

      # ---- explicitly NOT stateless: tokens must be persisted ----
      - key: WORKSPACE_MCP_STATELESS_MODE
        value: "false"

      # ---- no DEBUG log file inside the container ----
      # Render retains stdout. The mcp_server_debug.log file would hold
      # DEBUG-level query strings, identities and API error bodies on the
      # ephemeral filesystem for the life of the container.
      - key: WORKSPACE_MCP_FILE_LOGGING
        value: "false"

      # ---- tool surface ----
      # The six Workspace services plus the read-only Admin SDK (gadmin),
      # which the live deployment already enables: set_drive_permission's
      # groups-only guardrail resolves principals against the Directory.
      # No TOOL_TIER: all tiers of these services load, and the group access
      # policy (core/group_policy.yaml) narrows the surface per user instead.
      # appscript and gadmin_write stay opt-in (OPT_IN_TOOLS in main.py); per
      # CLAUDE.md appscript must not be enabled until audit logging has been
      # live and reviewed for 30 days.
      - key: TOOLS
        value: gmail drive calendar docs sheets contacts gadmin

      # ---- OAuth 2.1 mode (FastMCP GoogleProvider proxy) ----
      - key: MCP_ENABLE_OAUTH21
        value: "true"

      # ---- identity boundary ----
      # Only Google accounts on these domains may complete authentication.
      # Without it any Google account that finishes the OAuth flow gets a
      # session (with its own data, but on our server and our quota).
      #
      # One Workspace customer, several sign-in domains. In a multi-domain
      # customer the `hd` claim and the email domain carry the USER'S OWN
      # domain, so every domain that hosts a real sign-in account must be
      # listed or that entity's staff are locked out with an unexplained auth
      # failure. Enumerated from the live Directory (13 users, 2026-09-02):
      #   otbgroup.co.uk              11 users (OTB, and VALE/BIR staff until
      #                               valeautomotive.co.uk / bir-d.co.uk cut over)
      #   jit-logistics.com            1 user  (JIT)
      #   arthistorywithemily.co.uk    1 user  (/99 _SYSTEM/Personal; deliberately
      #                               excluded: not staff)
      #   blakefamily.uk               alias domain only, nobody signs in with it
      # Re-enumerate (gadmin list_users) and update this value at every domain
      # cutover or addition. It also defines "internal" for the capability
      # guards (external recipients, external shares).
      - key: OAUTH_ALLOWED_EMAIL_DOMAINS
        value: otbgroup.co.uk,jit-logistics.com

      # ---- dynamic client registration allowlist ----
      # Comma-separated redirect URI patterns MCP clients may register with.
      # Unset = FastMCP default = any URI (a phishable "register your own
      # client" surface). Set in the dashboard once the real client URIs are
      # confirmed from the Render logs, e.g.
      #   https://claude.ai/api/mcp/auth_callback,https://claude.com/api/mcp/auth_callback,http://localhost:*
      - key: MCP_ALLOWED_CLIENT_REDIRECT_URIS
        sync: false

      # ---- session lifetime ----
      # How long an MCP client may stay signed in to this server without the
      # user consenting again. FastMCP's default is one year; 30 days means a
      # leaver's client, a lost laptop or a stale registration re-prompts
      # within a month even if nobody revokes anything. Google-side
      # suspension still cuts access on the next call regardless.
      - key: MCP_OAUTH_REFRESH_TOKEN_TTL_S
        value: "2592000"

      # ---- shared drives the destination guard may trust outright ----
      # Comma-separated shared-drive IDs. Unset: every shared drive is judged
      # by its organizers (all on an internal domain = internal), which costs
      # one permissions.list per drive per five minutes and fails closed when
      # the caller cannot read the list. Fill in once the OTB drives exist.
      - key: DRIVE_INTERNAL_SHARED_DRIVE_IDS
        sync: false

      # ---- group-based tool access policy (core/access_policy.py) ----
      # "off" keeps today's behaviour (every otbgroup.co.uk user gets every
      # tool). Flip to "enforce" only after the CLAUDE.md multi-user rollout
      # checklist is complete: groups created, service account granted the
      # Groups Reader role, secrets below set, get_my_access verified.
      - key: MCP_GROUP_POLICY_MODE
        value: "off"
      # Service account key (base64 of the JSON key file) used ONLY for
      # Directory members.hasMember. Prefer a Render Secret File plus
      # MCP_GROUP_POLICY_SA_JSON_FILE=/etc/secrets/<name> if available.
      - key: MCP_GROUP_POLICY_SA_JSON_B64
        sync: false
      # Accounts that bypass the group lookup with full access (loudly logged).
      # Owner only; this is the "Directory API is down" escape hatch.
      - key: MCP_GROUP_POLICY_BREAKGLASS_EMAILS
        sync: false

      # ---- Drive soft-delete holding folder (CLAUDE.md destructive-tool trim) ----
      - key: DRIVE_HOLDING_FOLDER_ID
        sync: false

      # ---- audit logger tunables (see CLAUDE.md) ----
      # Dedicated audit writer (base64 service-account key). When set, every
      # row is written by this identity and users need no access to the
      # audit Sheet. Required before a second user is added: without it every
      # user must hold Editor on the Sheet and can read/alter every row.
      - key: AUDIT_SA_JSON_B64
        sync: false
      - key: AUDIT_FLUSH_INTERVAL_S
        value: "30"
      - key: AUDIT_BATCH_SIZE
        value: "50"
      - key: DEFAULT_USER
        value: oli

      # ---- secrets: set in dashboard, not in repo ----
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: AUDIT_SHEET_ID
        sync: false
      - key: FASTMCP_SERVER_AUTH_GOOGLE_JWT_SIGNING_KEY
        sync: false
